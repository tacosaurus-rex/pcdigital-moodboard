<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="FORGE Training OS: local-first workout and athlete load tracking.">
<title>FORGE Training OS</title>
<style>
html,body{margin:0;min-height:100%;background:#0b0d0c;color:#f5f7f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#forge-loader{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#0b0d0c;z-index:99999}
.forge-load-card{width:min(420px,100%);text-align:center}.forge-mark{font-size:56px;font-weight:950;letter-spacing:-4px;color:#d8ff63}
.forge-bar{height:5px;background:#222822;border-radius:999px;overflow:hidden;margin:22px 0}.forge-bar:before{content:"";display:block;width:42%;height:100%;background:#d8ff63;border-radius:inherit;animation:forgeLoad 1s ease-in-out infinite alternate}
@keyframes forgeLoad{to{transform:translateX(140%)}}.forge-small{color:#9ca69c;font-size:14px;line-height:1.45}
#forge-error{display:none;white-space:pre-wrap;text-align:left;background:#191d1a;border:1px solid #2b312b;border-radius:14px;padding:14px;margin-top:16px;color:#ffb4ae;font-size:12px}
</style>
</head>
<body>
<div id="forge-loader"><div class="forge-load-card"><div class="forge-mark">FORGE</div><div class="forge-bar"></div><div class="forge-small">Loading your training OS on this device…</div><div id="forge-error"></div></div></div>
<noscript>FORGE needs JavaScript to log and analyse workouts.</noscript>
<div id="app" aria-live="polite"></div><div id="modal-root"></div><div id="toast-root" aria-live="assertive"></div>
<script>
(async()=>{
  const files=Array.from({length:6},(_,i)=>`payload-${String(i).padStart(2,"0")}.txt`);
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  try{
    if(!("DecompressionStream" in window)) throw new Error("Open FORGE in a current version of Safari or Chrome.");
    const pieces=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:"force-cache"});
      if(!r.ok) throw new Error(`Could not load ${f} (${r.status})`);
      return (await r.text()).trim();
    }));
    const stream=new Blob([b(pieces.join(""))]).stream().pipeThrough(new DecompressionStream("gzip"));
    const packed=JSON.parse(new TextDecoder().decode(await new Response(stream).arrayBuffer()));
    const style=document.createElement("style"); style.textContent=packed.css; document.head.appendChild(style);
    document.getElementById("forge-loader").remove();
    (0,eval)(packed.js);
  }catch(e){
    const box=document.getElementById("forge-error"); box.style.display="block";
    box.textContent="FORGE could not start. Reload once in Safari or Chrome.\n\n"+(e&&e.stack||e);
  }
})();
</script>
</body>
</html>
